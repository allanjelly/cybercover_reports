[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercover-reports"
version = "0.1.0"
description = "Business-oriented JSON reports for Artemis"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.package-data]
cybercover_reports = ["catalog/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
