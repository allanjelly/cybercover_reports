    match: {paths: [misconfiguration], tags: [misconfig]}
    area: applications
    title: Nieprawidłowa konfiguracja usługi
    description: Usługa jest skonfigurowana w sposób, który obniża jej bezpieczeństwo.
    business_risk: Błędna konfiguracja może ułatwić atak lub ujawnić informacje o systemie.
    recommendation: Poproś administratora o poprawienie konfiguracji zgodnie z zaleceniami producenta.
  - key: vulnerable_software
