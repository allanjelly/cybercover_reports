report_types:
  misconfigured_email:
    area: domain
    title: Nieprawidłowa konfiguracja zabezpieczeń poczty
    description: Wykryto problem z konfiguracją zabezpieczeń poczty elektronicznej dla domeny.
    business_risk: Oszuści mogą łatwiej podszywać się pod firmę lub jej wiadomości mogą nie docierać do odbiorców.
    recommendation: Poproś administratora poczty o sprawdzenie szczegółów i poprawienie konfiguracji.
  open_port_remote_desktop:
    area: network
    title: Dostęp zdalny widoczny w internecie
    description: Usługa zdalnego dostępu jest dostępna z internetu.
    business_risk: Osoba nieuprawniona może próbować uzyskać dostęp do komputera lub sieci firmy.
    recommendation: Poproś administratora o ograniczenie dostępu i włączenie dodatkowego uwierzytelniania.
  open_port_database:
    area: network
    title: Baza danych dostępna z internetu
    description: Wykryto publicznie dostępną usługę bazy danych.
    business_risk: Nieuprawniona osoba może próbować uzyskać dostęp do danych firmy.
    recommendation: Poproś administratora o ograniczenie dostępu do zaufanych systemów.
  open_port_smb:
    area: network
    title: Usługa udostępniania plików dostępna z internetu
    description: Usługa udostępniania zasobów sieciowych jest dostępna z internetu.
    business_risk: Osoba nieuprawniona może próbować uzyskać dostęp do plików firmowych.
    recommendation: Poproś administratora o ograniczenie dostępu do sieci firmowej.
  open_port_telnet:
    area: network
    title: Niezabezpieczony dostęp zdalny
    description: Wykryto usługę zdalnego dostępu, która może przesyłać dane bez szyfrowania.
    business_risk: Hasła i dane mogą zostać przechwycone, a dostęp do systemu przejęty.
    recommendation: Poproś administratora o wyłączenie Telnetu i używanie bezpieczniejszego dostępu.
  directory_index:
    area: files
    title: Publiczna lista plików na stronie
    description: Serwer może pokazywać odwiedzającym zawartość katalogu.
    business_risk: Osoby postronne mogą znaleźć pliki, które nie powinny być publiczne.
    recommendation: Poproś administratora o sprawdzenie plików i wyłączenie listowania katalogów.
  zone_transfer_possible:
    area: domain
    title: Możliwe ujawnienie konfiguracji domeny
    description: Serwer DNS może udostępniać listę informacji o domenie.
    business_risk: Osoby postronne mogą poznać szczegóły infrastruktury firmy i wykorzystać je do przygotowania ataku.
    recommendation: Poproś administratora domeny o ograniczenie transferu strefy DNS.
  old_wordpress:
    area: applications
    title: Nieaktualna wersja WordPressa
    description: Wykryto wersję WordPressa wymagającą sprawdzenia aktualizacji.
    business_risk: Brak aktualizacji może z czasem narazić stronę na znane problemy bezpieczeństwa.
    recommendation: Poproś administratora o sprawdzenie aktualizacji i konfiguracji automatycznych aktualizacji.
  wordpress_outdated_plugin_theme:
    area: applications
    title: Nieaktualna wtyczka lub motyw WordPressa
    description: Wykryto wtyczkę lub motyw, dla których może być dostępna aktualizacja.
    business_risk: Znane błędy mogą umożliwić atak na stronę lub dostęp do jej danych.
    recommendation: Poproś administratora o weryfikację i aktualizację wskazanego składnika.
  expired_ssl_certificate:
    area: domain
    title: Wygasły certyfikat
    description: Certyfikat zabezpieczający połączenie wygasł.
    business_risk: Klienci mogą widzieć ostrzeżenia i nie móc bezpiecznie korzystać z usługi.
    recommendation: Poproś administratora o odnowienie i zainstalowanie certyfikatu.
  weak_admin_credentials:
    area: passwords
    title: Słabe dane logowania administratora
    description: Wykryto możliwość zalogowania się do panelu przy użyciu słabych danych.
    business_risk: Osoba nieuprawniona może przejąć kontrolę nad usługą lub uzyskać dostęp do danych.
    recommendation: Niezwłocznie zmień dane logowania i ogranicz dostęp do panelu.
  exposed_version_control_folder:
    area: files
    title: Publicznie dostępne pliki projektu
    description: Wykryto dostępny z internetu katalog zarządzania kodem strony.
    business_risk: Osoby postronne mogą poznać kod lub informacje ułatwiające atak.
    recommendation: Poproś administratora o zablokowanie dostępu i sprawdzenie ujawnionych danych.
  missing_security_headers:
    area: applications
    title: Brak części zabezpieczeń przeglądarki
    description: Strona nie przekazuje części zalecanych ustawień bezpieczeństwa.
    business_risk: Niektóre rodzaje ataków na użytkowników strony mogą być łatwiejsze.
    recommendation: Poproś administratora strony o sprawdzenie ustawień bezpieczeństwa serwera.
  exposed_password_file: &exposed_credentials
    area: passwords
    title: Hasła lub klucze dostępu dostępne publicznie
    description: Skan wykrył dostępny z internetu plik lub zasób, który może zawierać hasła, klucze lub inne dane logowania.
    business_risk: Osoba postronna może użyć tych danych, aby zalogować się do systemów firmy, poczty lub usług.
    recommendation: Pilnie usuń lub zablokuj dostęp do pliku i zmień wszystkie hasła oraz klucze, które mogły się w nim znaleźć.
  exposed_bash_history: *exposed_credentials
  exposed_keys: *exposed_credentials
  exposed_version_control_folder_with_credentials: *exposed_credentials
  leaked_sensitive_data: *exposed_credentials
  exposed_archive: &exposed_files
    area: files
    title: Potencjalnie wrażliwe pliki dostępne publicznie
    description: Skan wykrył dostępny z internetu plik lub zasób, który może zawierać dane nieprzeznaczone do publikacji.
    business_risk: Osoby postronne mogą poznać dane firmy lub informacje ułatwiające atak.
    recommendation: Poproś administratora o sprawdzenie zawartości i ograniczenie dostępu.
  exposed_configuration_file: *exposed_files
  exposed_dead_letter: *exposed_files
  exposed_file_with_listing: *exposed_files
  exposed_http_server_info_status: *exposed_files
  exposed_log_file: *exposed_files
  exposed_phpinfo: *exposed_files
  exposed_php_source: *exposed_files
  exposed_php_var_dump: *exposed_files
  exposed_sql_dump: *exposed_files
  command_injection: &code_execution
    area: applications
    title: Możliwe wykonanie nieautoryzowanych poleceń
    description: Wykryto podatność, która może pozwolić osobie postronnej na wykonanie poleceń w systemie.
    business_risk: Atakujący może uzyskać dostęp do danych lub zakłócić działanie usługi.
    recommendation: Pilnie przekaż wynik administratorowi, aby zweryfikował i usunął podatność.
  rce_vulnerability: *code_execution
  sql_injection:core: &injection
    area: applications
    title: Niebezpieczna obsługa danych na stronie
    description: Wykryto podatność w sposobie przetwarzania danych przez aplikację.
    business_risk: Atakujący może uzyskać dostęp do informacji lub zmienić działanie usługi.
    recommendation: Pilnie przekaż wynik administratorowi lub dostawcy aplikacji do naprawy.
  orm_injection: *injection
  sql_injection: *injection
  xss_vulnerability:
    area: applications
    title: Podatność mogąca zagrozić użytkownikom strony
    description: Strona może umożliwiać wprowadzenie niebezpiecznego kodu do przeglądarki użytkownika.
    business_risk: Osoba atakująca może próbować podszyć się pod użytkownika lub wykraść jego dane.
    recommendation: Poproś dostawcę strony o sprawdzenie i poprawienie obsługi wprowadzanych danych.
  lfi_vulnerability:
    area: applications
    title: Możliwy dostęp do plików serwera
    description: Wykryto podatność, która może pozwalać na odczyt plików przez aplikację.
    business_risk: Osoba postronna może uzyskać dostęp do danych lub informacji o konfiguracji.
    recommendation: Pilnie poproś dostawcę aplikacji o weryfikację i naprawę.
  exposed_database_with_easy_password: &weak_login
    area: passwords
    title: Słabe zabezpieczenie dostępu do usługi
    description: Usługa może być dostępna przy użyciu łatwych do odgadnięcia danych logowania.
    business_risk: Osoba nieuprawniona może uzyskać dostęp do systemu lub danych firmy.
    recommendation: Zmień dane logowania i poproś administratora o ograniczenie dostępu.
  exposed_ssh_with_easy_password: *weak_login
  exposed_wordpress_with_easy_password:
    area: passwords
    title: Słabe dane logowania do WordPressa
    description: Wykryto możliwość zalogowania się do WordPressa przy użyciu łatwych do odgadnięcia danych.
    business_risk: Osoba nieuprawniona może zmienić stronę lub uzyskać dostęp do jej danych.
    recommendation: Zmień dane logowania i poproś administratora o zabezpieczenie konta.
  ssh_known_bad_key:
    area: network
    title: Niebezpieczny klucz dostępu
    description: Wykryto znany niebezpieczny klucz używany do zabezpieczenia usługi SSH.
    business_risk: Bezpieczeństwo dostępu do systemu może być osłabione.
    recommendation: Poproś administratora o wymianę wskazanego klucza i sprawdzenie konfiguracji.
  writable_ftp:
    area: network
    title: Możliwy zapis plików na serwerze
    description: Wykryto usługę FTP, która może pozwalać osobom postronnym na zapisywanie plików.
    business_risk: Osoby nieuprawnione mogą umieścić niepożądane pliki lub zakłócić działanie usługi.
    recommendation: Poproś administratora o ograniczenie dostępu i uprawnień do zapisu.
  close_domain_expiration_date: &domain_expiry
    area: domain
    title: Zbliża się koniec ważności domeny
    description: Termin ważności domeny może wkrótce upłynąć.
    business_risk: Brak odnowienia może spowodować niedostępność strony lub poczty.
    recommendation: Sprawdź termin u rejestratora i odnów domenę.
  closed_wordpress_plugin:
    area: applications
    title: Wtyczka WordPressa może nie być wspierana
    description: Wykryto wtyczkę, która została wycofana z katalogu WordPressa.
    business_risk: Problemy bezpieczeństwa we wtyczce mogą nie otrzymywać poprawek.
    recommendation: Poproś administratora o ocenę wtyczki i rozważenie jej usunięcia lub zastąpienia.
  old_drupal: &old_cms
    area: applications
    title: System strony wymaga sprawdzenia aktualizacji
    description: Wykryto wersję systemu strony, która może być nieaktualna.
    business_risk: Znane błędy mogą umożliwić atak na stronę lub jej dane.
    recommendation: Poproś administratora o weryfikację wersji i dostępnych poprawek.
  old_joomla: *old_cms
  joomla_outdated_extension: *old_cms
  insecure_wordpress: *old_cms
  obsolete_moodle_version_found: *old_cms
  technology_cve_found:
    area: applications
    title: Możliwa podatność wykrytej technologii
    description: Wersja wykrytej technologii może być powiązana ze znaną podatnością.
    business_risk: Podatność może ułatwiać atak lub zakłócenie działania usługi.
    recommendation: Poproś administratora o potwierdzenie wersji i zastosowanie dostępnych poprawek.
  dangling_dns_record:
    area: domain
    title: Rekord domeny wymaga sprawdzenia
    description: Wykryto rekord domeny wskazujący na zasób, który może nie być już prawidłowo kontrolowany.
    business_risk: W niektórych przypadkach osoba postronna może przejąć wskazywany adres.
    recommendation: Poproś administratora domeny o weryfikację i usunięcie nieużywanego rekordu.
  removed_domain_existing_vhost:
    area: domain
    title: Nieaktualna konfiguracja domeny na serwerze
    description: Serwer może nadal obsługiwać nazwę domeny, która nie jest już zarejestrowana.
    business_risk: Osoba postronna może wykorzystać nieaktualną konfigurację.
    recommendation: Poproś administratora o sprawdzenie i usunięcie niepotrzebnej konfiguracji.
  script_unregistered_domain:
    area: applications
    title: Strona korzysta z zasobu w niezarejestrowanej domenie
    description: Wykryto odwołanie do skryptu w domenie, która może być dostępna do rejestracji.
    business_risk: Przejęcie domeny może umożliwić dostarczenie niebezpiecznego kodu użytkownikom strony.
    recommendation: Poproś administratora strony o usunięcie lub zastąpienie odwołania.
  exposed_ntlm_endpoint:
    area: network
    title: Publicznie dostępna usługa uwierzytelniania
    description: Wykryto dostępną z internetu usługę używającą mechanizmu uwierzytelniania NTLM.
    business_risk: Informacje o infrastrukturze mogą ułatwić próby ataku na konta firmowe.
    recommendation: Poproś administratora o sprawdzenie potrzeby publicznego dostępu i konfiguracji usługi.
  certificate_authority_invalid: &certificate
    area: domain
    title: Problem z certyfikatem usługi
    description: Wykryto problem z certyfikatem zabezpieczającym połączenie.
    business_risk: Użytkownicy mogą otrzymywać ostrzeżenia lub nie móc bezpiecznie korzystać z usługi.
    recommendation: Poproś administratora o sprawdzenie i poprawienie certyfikatu.
  bad_certificate_names: *certificate
  no_https_redirect:
    area: domain
    title: Strona nie zawsze wymusza bezpieczne połączenie
    description: Połączenia przez HTTP mogą nie być przekierowywane na szyfrowane HTTPS.
    business_risk: Dane przesyłane przez niezabezpieczone połączenie mogą być przechwycone.
    recommendation: Poproś administratora o włączenie przekierowania na HTTPS.
  forti_vuln:
    area: network
    title: Podatne urządzenie zabezpieczające sieć firmy
    description: Wykryto urządzenie Fortinet (np. zaporę lub bramę VPN) w wersji ze znaną, często wykorzystywaną podatnością.
    business_risk: Atakujący aktywnie wykorzystują takie podatności, aby dostać się do sieci firmy i wykraść lub zaszyfrować dane.
    recommendation: Pilnie poproś administratora o aktualizację oprogramowania urządzenia i sprawdzenie, czy nie doszło do włamania.
  heartbleed:
    area: domain
    title: Krytyczna podatność szyfrowania połączeń (Heartbleed)
    description: Serwer używa wersji oprogramowania szyfrującego podatnej na znany błąd Heartbleed.
    business_risk: Atakujący może odczytać z pamięci serwera hasła, klucze szyfrujące i dane klientów.
    recommendation: Pilnie zaktualizuj oprogramowanie serwera, a następnie wymień certyfikat i hasła.
  robot:
    area: domain
    title: Słabe szyfrowanie połączeń z serwerem
    description: Serwer jest podatny na znany atak na szyfrowanie połączeń (ROBOT).
    business_risk: W pewnych warunkach atakujący może odszyfrować przechwycone połączenia z serwerem.
    recommendation: Poproś administratora o aktualizację serwera lub wyłączenie przestarzałych metod szyfrowania.
  subdomain_takeover_possible:
    area: domain
    title: Możliwe przejęcie adresu w domenie firmy
    description: Adres w domenie firmy wskazuje na zewnętrzną usługę, która nie jest już używana.
    business_risk: Osoba postronna może zarejestrować tę usługę i opublikować pod adresem firmy własną treść, np. fałszywą stronę logowania.
    recommendation: Poproś administratora domeny o usunięcie lub poprawienie nieużywanego wpisu DNS.
  nuclei_exposed_panel:
    area: applications
    title: Panel administracyjny widoczny w internecie
    description: Strona logowania do panelu zarządzania usługą jest dostępna dla każdego z internetu.
    business_risk: Atakujący mogą próbować odgadnąć hasło lub wykorzystać błędy panelu, aby przejąć kontrolę nad usługą.
    recommendation: Poproś administratora o ograniczenie dostępu do panelu (np. tylko z sieci firmowej lub przez VPN) i włączenie silnego uwierzytelniania.

# Reviewed texts for individual Nuclei templates, keyed by template-id. They take precedence over
# nuclei_classes. Add entries for templates that frequently occur in customer scans.
nuclei: {}

# Kinds of problems detected by Nuclei templates, used when a template has no entry in `nuclei`.
# Checked in order - the first class whose path fragment occurs in the template path
# (e.g. "default-logins" matches http/default-logins/grafana/x.yaml) or whose tag the template has wins,
# so the most specific classes come first.
nuclei_classes:
  - key: remote_code_execution
    match: {paths: [rce, cmdi, command-injection, deserialization], tags: [rce, cmdi, deserialization, ssti]}
    area: applications
    title: Możliwe przejęcie kontroli nad serwerem
    description: Wykryto podatność, która może pozwolić osobie z internetu na uruchamianie własnych poleceń na serwerze.
    business_risk: Atakujący może przejąć serwer, wykraść dane, zaszyfrować je dla okupu lub wykorzystać serwer do dalszych ataków.
    recommendation: Pilnie przekaż wynik administratorowi lub dostawcy usługi - podatność wymaga natychmiastowej aktualizacji lub zabezpieczenia.
  - key: sql_injection
    match: {paths: [sqli], tags: [sqli]}
    area: applications
    title: Możliwy nieuprawniony dostęp do bazy danych strony
    description: Aplikacja może przekazywać dane wpisane przez użytkownika bezpośrednio do bazy danych.
    business_risk: Atakujący może odczytać lub zmienić dane przechowywane przez aplikację, np. dane klientów lub hasła.
    recommendation: Pilnie przekaż wynik dostawcy aplikacji do naprawy.
  - key: cross_site_scripting
    match: {paths: [xss], tags: [xss]}
    area: applications
    title: Podatność mogąca zagrozić użytkownikom strony
    description: Strona może umożliwiać umieszczenie niebezpiecznego kodu, który uruchomi się w przeglądarce odwiedzających.
    business_risk: Atakujący może podszyć się pod użytkownika strony, przejąć jego sesję lub wyłudzić dane.
    recommendation: Poproś dostawcę strony o poprawienie obsługi wprowadzanych danych.
  - key: file_read
    match: {paths: [lfi, path-traversal], tags: [lfi, traversal, file-read]}
    area: applications
    title: Możliwy dostęp do plików serwera
    description: Wykryto podatność, która może pozwalać na odczyt plików z serwera, w tym plików konfiguracyjnych.
    business_risk: Osoba postronna może poznać hasła, klucze lub dane zapisane na serwerze.
    recommendation: Pilnie poproś administratora lub dostawcę aplikacji o aktualizację i weryfikację, czy dane nie wyciekły.
  - key: server_side_request_forgery
    match: {paths: [ssrf], tags: [ssrf]}
    area: applications
    title: Serwer może zostać użyty do ataku na sieć wewnętrzną
    description: Aplikacja może wykonywać połączenia pod adresy wskazane przez osobę z zewnątrz.
    business_risk: Atakujący może dotrzeć do systemów niedostępnych z internetu lub wykraść dane dostępowe usług chmurowych.
    recommendation: Przekaż wynik dostawcy aplikacji do naprawy.
  - key: authentication_bypass
    match: {paths: [auth-bypass], tags: [auth-bypass, unauth, unauthenticated]}
    area: applications
    title: Dostęp do funkcji bez logowania
    description: Część usługi, która powinna wymagać logowania, może być dostępna bez hasła.
    business_risk: Osoba postronna może korzystać z funkcji administracyjnych lub przeglądać dane bez uprawnień.
    recommendation: Pilnie poproś administratora o aktualizację usługi i ograniczenie dostępu.
  - key: default_login
    match: {paths: [default-logins, default-login], tags: [default-login]}
    area: passwords
    title: Domyślne hasło dostępu do usługi
    description: Do usługi można zalogować się przy użyciu domyślnej nazwy użytkownika i hasła ustawionych przez producenta.
    business_risk: Domyślne hasła są publicznie znane - każdy może zalogować się i przejąć kontrolę nad usługą.
    recommendation: Niezwłocznie zmień hasło na silne i unikalne oraz ogranicz dostęp do usługi z internetu.
  - key: takeover
    match: {paths: [takeovers, takeover], tags: [takeover]}
    area: domain
    title: Możliwe przejęcie adresu w domenie firmy
    description: Adres w domenie firmy wskazuje na zewnętrzną usługę, która nie jest już używana.
    business_risk: Osoba postronna może zarejestrować tę usługę i opublikować pod adresem firmy własną treść, np. fałszywą stronę logowania.
    recommendation: Poproś administratora domeny o usunięcie lub poprawienie nieużywanego wpisu DNS.
  - key: exposed_secrets
    match: {paths: [exposures/tokens, exposures/keys], tags: [token, tokens, keys, secret, secrets, api-key]}
    area: passwords
    title: Publicznie dostępne klucze lub hasła
    description: W publicznie dostępnej treści znaleziono dane wyglądające na klucze dostępowe lub hasła.
    business_risk: Osoba postronna może użyć tych danych, aby dostać się do systemów lub usług firmy, również płatnych.
    recommendation: Pilnie unieważnij i wymień ujawnione klucze oraz hasła i usuń je z publicznej treści.
  - key: exposed_backup
    match: {paths: [exposures/backups], tags: [backup]}
    area: files
    title: Publicznie dostępna kopia zapasowa
    description: Na serwerze znaleziono kopię zapasową dostępną dla każdego z internetu.
    business_risk: Kopia może zawierać kod strony, bazę danych lub hasła, które ułatwią atak lub doprowadzą do wycieku danych.
    recommendation: Poproś administratora o usunięcie kopii z publicznego miejsca i sprawdzenie, czy zawierała dane wrażliwe.
  - key: exposed_configuration
    match: {paths: [exposures/configs], tags: [config]}
    area: files
    title: Publicznie dostępny plik konfiguracyjny
    description: Na serwerze znaleziono plik konfiguracyjny dostępny dla każdego z internetu.
    business_risk: Plik może zawierać hasła lub informacje o systemach, które ułatwią atak.
    recommendation: Poproś administratora o zablokowanie dostępu do pliku i wymianę haseł, które mogły się w nim znaleźć.
  - key: exposed_logs
    match: {paths: [exposures/logs], tags: [logs]}
    area: files
    title: Publicznie dostępne dzienniki systemowe
    description: Na serwerze znaleziono pliki dziennika (logi) dostępne dla każdego z internetu.
    business_risk: Logi mogą zawierać dane klientów, adresy wewnętrzne lub informacje o błędach ułatwiające atak.
    recommendation: Poproś administratora o zablokowanie dostępu do logów.
  - key: exposure
    match: {paths: [exposures], tags: [exposure]}
    area: files
    title: Publicznie dostępne informacje, które nie powinny być widoczne
    description: Serwer udostępnia plik lub informacje przeznaczone tylko do użytku wewnętrznego.
    business_risk: Ujawnione informacje mogą ułatwić przygotowanie ataku lub zawierać dane firmy.
    recommendation: Poproś administratora o sprawdzenie wskazanego zasobu i ograniczenie do niego dostępu.
  - key: known_vulnerability
    match: {paths: [cves, cnvd], tags: [cve, kev, cnvd]}
    area: applications
    title: Znana podatność w używanym oprogramowaniu
    description: Wykryto oprogramowanie z opisaną publicznie podatnością bezpieczeństwa.
    business_risk: Dla znanych podatności często istnieją gotowe narzędzia, więc atak może być łatwy do przeprowadzenia.
    recommendation: Poproś administratora o aktualizację oprogramowania do wersji z poprawką bezpieczeństwa.
