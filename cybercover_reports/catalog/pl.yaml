# Used when a finding has neither a curated entry nor a class.
by_severity:
  high:
    area: applications
    title: Poważny problem bezpieczeństwa wymagający pilnej oceny
    description: Skan wykrył problem oznaczony jako poważny, dla którego nie ma jeszcze zatwierdzonego opisu.
    business_risk: Problemy tego rodzaju często umożliwiają atak na firmę lub wyciek danych.
    recommendation: Pilnie przekaż wynik administratorowi lub opiekunowi IT do analizy.
  medium:
    area: applications
    title: Problem bezpieczeństwa wymagający oceny
    description: Skan wykrył problem o średnim znaczeniu, dla którego nie ma jeszcze zatwierdzonego opisu.
    business_risk: Problem może ułatwić atak, zwłaszcza w połączeniu z innymi słabościami.
    recommendation: Przekaż wynik administratorowi do analizy w najbliższym czasie.
  low:
    area: applications
    title: Drobny problem bezpieczeństwa
    description: Skan wykrył problem o niskim znaczeniu, dla którego nie ma jeszcze zatwierdzonego opisu.
    business_risk: Bezpośrednie zagrożenie jest niewielkie, ale warto usunąć problem przy okazji innych prac.
    recommendation: Przekaż wynik administratorowi przy najbliższym przeglądzie systemów.

generic:
  area: applications
  title: Wykryto problem wymagający oceny
  description: Skan wykrył problem, dla którego nie ma jeszcze zatwierdzonego opisu.
  business_risk: Wpływ na firmę wymaga oceny specjalisty.
  recommendation: Przekaż wynik administratorowi do analizy.

